name: release_docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish
        required: true
        default: v0.0.3

permissions:
  contents: read
  packages: write

jobs:
  release_docker:
    name: Release Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/haoweili97/alist
          tags: |
            type=raw,value=${{ github.event.release.tag_name || inputs.version }}
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Docker meta with ffmpeg
        id: meta-ffmpeg
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/haoweili97/alist
          tags: |
            type=raw,value=${{ github.event.release.tag_name || inputs.version }}
            type=raw,value=latest
          flavor: |
            latest=false
            suffix=-ffmpeg,onlatest=true
            
      - name: Build and push with ffmpeg
        id: docker_build_ffmpeg
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-ffmpeg.outputs.tags }}
          labels: ${{ steps.meta-ffmpeg.outputs.labels }}
          build-args: INSTALL_FFMPEG=true
          platforms: linux/amd64,linux/arm64
